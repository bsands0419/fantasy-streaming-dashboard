<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fantasy Streaming Dashboard v4.2</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
<header><div><div class="eyebrow">FANTASY FOOTBALL</div><h1>Streaming Dashboard <span>v4.2</span></h1><p>D/ST + Kicker weekly rankings</p></div><div class="updated" id="updatedBadge">Loading...</div></header>
<section class="controls card"><label>Position<select id="position"><option value="dst">D/ST</option><option value="k">Kicker</option></select></label><label>Scoring<select id="scoring"></select></label><button id="refreshPage">Reload data</button></section>
<div id="custom" class="custom"></div>
<section class="stats"><div class="card"><small>#1 option</small><strong id="leader">—</strong></div><div class="card"><small>Projection</small><strong id="leaderProj">—</strong></div><div class="card"><small>P(Top 5)</small><strong id="leaderTop5">—</strong></div><div class="card"><small>P(Top 10)</small><strong id="leaderTop10">—</strong></div></section>
<section class="card tablecard"><div class="tabletop"><div><h2>Week 1 Rankings</h2><span id="lastUpdated"></span></div><button id="toggleAll">Show all 32</button></div><div id="loading">Loading model snapshot...</div><div class="scroll"><table id="table" hidden><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="footer"><span id="showing"></span><span id="note"></span></div></section>
</div>
<script src="app.js"></script>
</body></html>
