name: Rookie Models Stage 6 TeamRankings SOS Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rookie_models/stage6_sos_probe.py'
      - '.github/workflows/rookie-models-stage6-sos-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt
      - name: Install dependencies
        run: pip install -r rookie_models/requirements_v3.txt
      - name: Probe TeamRankings
        id: probe
        continue-on-error: true
        run: |
          set +e
          python rookie_models/stage6_sos_probe.py > rookie_models/stage6_sos_probe.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Publish probe result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_stage6_sos/teamrankings_probe_2025.csv rookie_models/stage6_sos_probe.log || true
          if git diff --cached --quiet; then
            echo "No probe changes"
          else
            git commit -m "Publish TeamRankings SOS probe"
            git push
          fi
      - name: Fail if probe failed
        if: steps.probe.outcome == 'failure'
        run: |
          cat rookie_models/stage6_sos_probe.log
          exit 1
