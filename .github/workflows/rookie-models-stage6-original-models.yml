name: Rookie Models Stage 6 Original Models
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rookie_models/stage6_original_models.py'
      - '.github/workflows/rookie-models-stage6-original-models.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt
      - run: pip install -r rookie_models/requirements_v3.txt
      - run: pip install catboost
      - name: Run original-data search with captured log
        run: |
          mkdir -p rookie_models/results_stage6_newmodels/original_branch
          set +e
          python rookie_models/stage6_original_models.py > rookie_models/results_stage6_newmodels/original_branch/run.log 2>&1
          code=$?
          echo "$code" > rookie_models/results_stage6_newmodels/original_branch/exit_code.txt
          exit 0
      - name: Publish results and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_stage6_newmodels/original_branch/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Stage 6 original-data model search"
          git push
