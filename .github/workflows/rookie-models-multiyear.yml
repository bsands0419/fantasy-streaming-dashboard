name: Rookie Models 2023-2026 Multiyear Rankings

on:
  push:
    branches:
      - agent/multiyear-2023-2026
    paths:
      - 'rookie_models/multiyear_rankings_2023_2026.py'
      - '.github/workflows/rookie-models-multiyear.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt
      - name: Install dependencies
        run: pip install -r rookie_models/requirements_v3.txt
      - name: Build 2023-2026 rankings
        run: python rookie_models/multiyear_rankings_2023_2026.py
      - name: Commit multiyear outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_multiyear_2023_2026
          if git diff --cached --quiet; then
            echo "No multiyear output changes"
          else
            git commit -m "Publish 2023-2026 multiyear rookie rankings"
            git push
          fi
