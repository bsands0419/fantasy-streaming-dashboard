name: Rookie Models Stage 5C Uncertainty

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rookie_models/stage5c_uncertainty.py'
      - '.github/workflows/rookie-models-stage5c.yml'

permissions:
  contents: write

jobs:
  uncertainty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt

      - name: Install dependencies
        run: pip install -r rookie_models/requirements_v3.txt

      - name: Run Stage 5C uncertainty and diagnosis
        run: python rookie_models/stage5c_uncertainty.py

      - name: Commit Stage 5C outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_stage5c
          if git diff --cached --quiet; then
            echo "No Stage 5C output changes"
          else
            git commit -m "Publish Stage 5C uncertainty and diagnosis"
            git push
          fi

# Explicit post-registration trigger for Stage 5C.
