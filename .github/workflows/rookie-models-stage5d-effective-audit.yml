name: Rookie Models Stage 5D Effective Feature Audit

# Trigger after workflow registration on main.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rookie_models/stage5d_effective_feature_audit.py'
      - '.github/workflows/rookie-models-stage5d-effective-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt

      - name: Install dependencies
        run: pip install -r rookie_models/requirements_v3.txt

      - name: Run effective frozen-feature audit
        run: python rookie_models/stage5d_effective_feature_audit.py

      - name: Commit effective audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_stage5d
          if git diff --cached --quiet; then
            echo "No effective feature audit changes"
          else
            git commit -m "Publish Stage 5D effective feature audit"
            git push
          fi
