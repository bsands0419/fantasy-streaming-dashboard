name: Rookie Models Stage 6 SOS Transfer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rookie_models/stage6_sos_transfer.py'
      - '.github/workflows/rookie-models-stage6-sos-transfer.yml'
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python rookie_models/stage6_sos_transfer.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_stage6_sos/*_transfer_*.txt rookie_models/results_stage6_sos/*_transfer_count.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish SOS transfer chunks"
          git push
# trigger
