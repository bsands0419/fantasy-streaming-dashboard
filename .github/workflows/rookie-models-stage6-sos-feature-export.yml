name: Rookie Models Stage 6 TeamRankings SOS Feature Export

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rookie_models/stage6_sos_feature_export.py'
      - '.github/workflows/rookie-models-stage6-sos-feature-export.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt
      - name: Install dependencies
        run: pip install -r rookie_models/requirements_v3.txt
      - name: Export final-date SOS prospect features
        id: export
        continue-on-error: true
        run: |
          set +e
          python rookie_models/stage6_sos_feature_export.py > rookie_models/stage6_sos_feature_export.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Publish SOS feature export
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_stage6_sos/prospect_teamrankings_sos_features_final_dates.csv rookie_models/results_stage6_sos/prospect_teamrankings_sos_coverage_final_dates.csv rookie_models/results_stage6_sos/team_name_match_audit_final_dates.csv rookie_models/stage6_sos_feature_export.log || true
          if git diff --cached --quiet; then
            echo "No SOS feature export changes"
          else
            git commit -m "Publish final-date TeamRankings SOS prospect features"
            git push
          fi
      - name: Fail if export failed
        if: steps.export.outcome == 'failure'
        run: |
          cat rookie_models/stage6_sos_feature_export.log
          exit 1

# post-registration trigger
