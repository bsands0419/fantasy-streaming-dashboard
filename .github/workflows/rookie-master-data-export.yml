name: Rookie Master Data Export
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rookie-master-data-export.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage master data inputs
        run: |
          mkdir -p master_data_export
          cp rookie_models/results_v4/prospect_pool_v4.csv master_data_export/
          cp rookie_models/results_2025/prospect_pool_2025.csv master_data_export/
          cp rookie_models/results_2026/prospect_pool_2026.csv master_data_export/
          cp rookie_models/results_2026/historical_prospect_oof.csv master_data_export/
          cp rookie_models/results_2026/manifest.json master_data_export/results_2026_manifest.json
          if [ -f rookie_models/results_full_history/all_model_results_2007_2026.csv ]; then cp rookie_models/results_full_history/all_model_results_2007_2026.csv master_data_export/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: rookie-master-data-inputs
          path: master_data_export/
          retention-days: 7
      - name: Publish run id
        run: |
          echo "$GITHUB_RUN_ID" > rookie_models/master_data_export_run_id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/master_data_export_run_id.txt
          git commit -m "Publish rookie master data export run id" || true
          git push
