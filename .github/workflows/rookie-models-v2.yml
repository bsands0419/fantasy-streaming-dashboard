name: Build rookie prospect models v2
on:
  push:
    paths:
      - 'rookie_models/stage2.py'
      - 'rookie_models/modeling.py'
      - 'rookie_models/requirements.txt'
      - '.github/workflows/rookie-models-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rookie-prospect-models-v2
  cancel-in-progress: false
jobs:
  model-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements.txt
      - run: pip install -r rookie_models/requirements.txt
      - name: Syntax check
        run: python -m py_compile rookie_models/stage2.py rookie_models/modeling.py
      - name: Run stage 2 leakage-safe model search
        run: python rookie_models/stage2.py
      - name: Commit stage 2 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_v2 rookie_models/trained_v2
          git diff --cached --quiet || git commit -m "Update stage 2 rookie prospect model results"
          git pull --rebase origin main
          git push
