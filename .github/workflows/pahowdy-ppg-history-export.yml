name: Pahowdy Historical PPG Export
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pahowdy-ppg-history-export.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nflreadpy pandas pyarrow
      - name: Export player regular-season stats 2001-2025
        run: |
          mkdir -p pahowdy_ppg_export
          python - <<'PY'
          import nflreadpy as nfl
          import pandas as pd
          years=list(range(2001,2026))
          frames=[]
          for y in years:
              try:
                  x=nfl.load_player_stats([y], summary_level='reg').to_pandas()
                  x['season_loaded']=y
                  frames.append(x)
                  print('loaded', y, len(x))
              except Exception as e:
                  print('FAILED', y, repr(e))
          out=pd.concat(frames, ignore_index=True)
          out.to_csv('pahowdy_ppg_export/nflverse_player_reg_2001_2025.csv', index=False)
          print('rows', len(out), 'cols', len(out.columns))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pahowdy-historical-ppg-source
          path: pahowdy_ppg_export/
          retention-days: 7
      - name: Publish run id
        run: |
          echo "$GITHUB_RUN_ID" > rookie_models/pahowdy_ppg_history_run_id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/pahowdy_ppg_history_run_id.txt
          git commit -m "Publish Pahowdy historical PPG export run id" || true
          git push
