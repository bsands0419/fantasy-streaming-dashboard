name: Rookie Models Stage 5 Calibration

on:
  workflow_dispatch:
  push:
    branches:
      - agent/stage5-calibration
    paths:
      - 'rookie_models/stage5_calibration.py'
      - '.github/workflows/rookie-models-stage5.yml'

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt

      - name: Install dependencies
        run: pip install -r rookie_models/requirements_v3.txt

      - name: Run Stage 5A calibration
        run: python rookie_models/stage5_calibration.py

      - name: Commit Stage 5A outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_stage5
          if git diff --cached --quiet; then
            echo "No Stage 5A output changes"
          else
            git commit -m "Publish Stage 5A calibration results"
            git push
          fi
