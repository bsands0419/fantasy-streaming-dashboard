name: Rookie Models Stage 6 TeamRankings SOS History

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rookie_models/stage6_sos_history.py'
      - '.github/workflows/rookie-models-stage6-sos-history.yml'

permissions:
  contents: write

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt
      - name: Install dependencies
        run: pip install -r rookie_models/requirements_v3.txt
      - name: Build SOS history
        id: history
        continue-on-error: true
        run: |
          set +e
          python rookie_models/stage6_sos_history.py > rookie_models/stage6_sos_history.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Publish SOS history checkpoint
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_stage6_sos/teamrankings_sos_history.csv rookie_models/results_stage6_sos/teamrankings_fetch_failures.csv rookie_models/stage6_sos_history.log || true
          if git diff --cached --quiet; then
            echo "No history changes"
          else
            git commit -m "Publish TeamRankings SOS history"
            git push
          fi
      - name: Fail if history build failed
        if: steps.history.outcome == 'failure'
        run: |
          cat rookie_models/stage6_sos_history.log
          exit 1

# post-registration trigger
