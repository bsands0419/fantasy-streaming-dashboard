name: Rookie Models Stage 6 All-Data Ensemble
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rookie_models/stage6_all_data_ensemble.py'
      - 'rookie_models/results_stage6_newmodels/advanced_selected_validation_regression_oof.csv'
      - 'rookie_models/results_stage6_newmodels/advanced_selected_2023_regression.csv'
      - 'rookie_models/results_stage6_newmodels/original_branch/selected_validation_oof.csv'
      - 'rookie_models/results_stage6_newmodels/original_branch/confirmation_2023_predictions.csv'
      - '.github/workflows/rookie-models-stage6-all-data-ensemble.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy scikit-learn
      - run: python rookie_models/stage6_all_data_ensemble.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_stage6_newmodels/all_data_ensemble/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Stage 6 all-data ensemble results"
          git push
