name: Rookie Models Stage 6 Pool School Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rookie_models/stage6_pool_school_probe.py'
      - '.github/workflows/rookie-models-stage6-pool-school-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - run: python rookie_models/stage6_pool_school_probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_stage6_sos/pool_school_probe_*.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish prospect pool school probe"
          git push
# trigger
