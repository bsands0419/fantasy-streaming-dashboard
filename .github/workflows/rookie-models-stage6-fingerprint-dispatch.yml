name: Rookie Models Stage 6 Fingerprint Recovery Dispatch
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rookie-models-stage6-fingerprint-dispatch.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage6-final-refit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt
      - run: pip install -r rookie_models/requirements_v3.txt
      - run: pip install catboost==1.2.8
      - name: Recover models from frozen OOF fingerprints
        run: python rookie_models/stage6_fingerprint_recovery.py
      - name: Publish fingerprint results to refit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_stage6_fingerprint_recovery/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Stage 6 OOF fingerprint recovery"
          git push origin HEAD:stage6-final-refit
