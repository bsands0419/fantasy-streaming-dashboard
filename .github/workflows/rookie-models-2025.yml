name: Rookie Models 2025 Score

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rookie_models/score_2025.py'
      - '.github/workflows/rookie-models-2025.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'rookie_models/score_2025.py'
      - '.github/workflows/rookie-models-2025.yml'

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt

      - name: Install dependencies
        run: pip install -r rookie_models/requirements_v3.txt

      - name: Score 2025 class
        id: score
        continue-on-error: true
        run: |
          mkdir -p rookie_models/results_2025
          python rookie_models/score_2025.py > rookie_models/results_2025/run.log 2>&1

      - name: Commit 2025 outputs and log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_2025
          if git diff --cached --quiet; then
            echo "No 2025 output changes"
          else
            git commit -m "Publish 2025 rookie model reconstruction"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Fail if scoring failed
        if: steps.score.outcome == 'failure'
        run: |
          cat rookie_models/results_2025/run.log
          exit 1
