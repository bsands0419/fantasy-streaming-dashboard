name: Final Model Export
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-model-export.yml'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact prediction files
        uses: actions/upload-artifact@v4
        with:
          name: final-model-predictions
          path: |
            rookie_models/results_2023_2026_final/rookie_results_2024.csv
            rookie_models/results_2023_2026_final/rookie_results_2025.csv
            rookie_models/results_2023_2026_final/rookie_results_2026.csv
            rookie_models/results_2023_2026_final/manifest.json
            rookie_models/results_2023_2026_final/README.md
          if-no-files-found: error
      - name: Publish run id to export branch
        run: |
          git fetch origin final-model-export
          git checkout final-model-export
          printf '%s\n' "$GITHUB_RUN_ID" > rookie_models/final_model_export_run_id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/final_model_export_run_id.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish final model export run id"
          git push origin final-model-export
