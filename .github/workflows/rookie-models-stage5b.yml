name: Rookie Models Stage 5B Comps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rookie_models/stage5b_comps.py'
      - '.github/workflows/rookie-models-stage5b.yml'

permissions:
  contents: write

jobs:
  comps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt

      - name: Install dependencies
        run: pip install -r rookie_models/requirements_v3.txt

      - name: Run Stage 5B comps and confidence
        run: python rookie_models/stage5b_comps.py

      - name: Commit Stage 5B outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_stage5b
          if git diff --cached --quiet; then
            echo "No Stage 5B output changes"
          else
            git commit -m "Publish Stage 5B historical comps and confidence"
            git push
          fi
