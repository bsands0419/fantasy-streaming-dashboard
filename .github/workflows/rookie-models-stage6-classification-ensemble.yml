name: Rookie Models Stage 6 Classification Ensemble
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rookie_models/stage6_classification_ensemble_search.py'
      - '.github/workflows/rookie-models-stage6-classification-ensemble.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scikit-learn
      - run: python rookie_models/stage6_classification_ensemble_search.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_stage6_newmodels/classification_ensemble/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Stage 6 classification ensemble search"
          git push
