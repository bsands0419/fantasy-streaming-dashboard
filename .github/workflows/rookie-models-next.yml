name: Advance rookie prospect pipeline
on:
  push:
    paths:
      - 'rookie_models/score_2026.py'
      - 'rookie_models/stage4_audit.py'
      - 'rookie_models/results_v3/market_benchmark.csv'
      - '.github/workflows/rookie-models-next.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rookie-prospect-next
  cancel-in-progress: false
jobs:
  audit-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt
      - run: pip install -r rookie_models/requirements_v3.txt
      - name: Cache authenticated SportsDataverse release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p rookie_models/.cache
          for tag in espn_cfb_passing espn_cfb_rushing espn_cfb_receiving espn_cfb_team_summaries; do
            gh api "repos/sportsdataverse/sportsdataverse-data/releases/tags/${tag}" \
              --jq '.assets | map({key: .name, value: .browser_download_url}) | from_entries' \
              > "rookie_models/.cache/${tag}_assets.json"
          done
      - name: Syntax check
        run: python -m py_compile rookie_models/stage4_audit.py rookie_models/score_2026.py
      - name: Run frozen Stage 4 robustness audit
        run: python -u rookie_models/stage4_audit.py
      - name: Score live 2026 class with frozen Stage 3 models
        env:
          PYTHONUNBUFFERED: '1'
        run: python -u rookie_models/score_2026.py
      - name: Commit audit and 2026 scoring outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_v4_audit rookie_models/results_2026
          git diff --cached --quiet || git commit -m "Publish Stage 4 audit and 2026 rookie rankings"
          git pull --rebase origin main
          git push
