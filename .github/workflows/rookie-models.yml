name: Build rookie prospect models
on:
  push:
    paths:
      - 'rookie_models/modeling.py'
      - 'rookie_models/requirements.txt'
      - '.github/workflows/rookie-models.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rookie-prospect-models
  cancel-in-progress: false
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements.txt
      - run: pip install -r rookie_models/requirements.txt
      - name: Correct optional RB receiving columns
        run: python -c "from pathlib import Path; p=Path('rookie_models/modeling.py'); s=p.read_text(); s=s.replace(\"m['scrim_yards']=m.rush_yards.fillna(0)+m.get('rec_yards',0).fillna(0)\",\"m['scrim_yards']=m.rush_yards.fillna(0)+(m['rec_yards'].fillna(0) if 'rec_yards' in m.columns else 0)\"); s=s.replace(\"m['scrim_ypg']=m.rush_ypg.fillna(0)+m.get('rec_ypg',0).fillna(0)\",\"m['scrim_ypg']=m.rush_ypg.fillna(0)+(m['rec_ypg'].fillna(0) if 'rec_ypg' in m.columns else 0)\"); p.write_text(s)"
      - name: Run leakage-safe four-position model search
        run: python rookie_models/modeling.py
      - name: Commit research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results rookie_models/trained
          git diff --cached --quiet || git commit -m "Update rookie prospect model results"
          git push
