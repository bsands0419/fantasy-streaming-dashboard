name: Rookie Models Stage 6 Original Selected Predictions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rookie_models/stage6_original_selected_predictions.py'
      - '.github/workflows/rookie-models-stage6-original-selected-predictions.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt
      - run: pip install -r rookie_models/requirements_v3.txt
      - run: pip install catboost
      - run: python rookie_models/stage6_original_selected_predictions.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_stage6_newmodels/original_branch/confirmation_2023_predictions.csv rookie_models/results_stage6_newmodels/original_classifiers/confirmation_2023_predictions.csv 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Stage 6 original selected confirmation predictions"
          git push
