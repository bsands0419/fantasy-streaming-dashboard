name: Peak College PPG 2026
on:
  push:
    branches: [main]
    paths:
      - 'rookie_models/peak_college_ppg_2026.py'
      - '.github/workflows/peak-college-ppg-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests rapidfuzz
      - run: python rookie_models/peak_college_ppg_2026.py
      - name: Publish output
        run: |
          git pull --rebase
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_pahowdy_context/peak_college_ppg_2026.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish 2026 peak college PPG seasons"
          git push
