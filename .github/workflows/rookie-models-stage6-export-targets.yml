name: Rookie Models Stage 6 Export Targets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rookie_models/stage6_export_targets.py'
      - '.github/workflows/rookie-models-stage6-export-targets.yml'

permissions:
  contents: write

jobs:
  export-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt
      - name: Install dependencies
        run: pip install pandas
      - name: Export completed Stage 6 targets
        run: python rookie_models/stage6_export_targets.py > rookie_models/stage6_export_targets.log 2>&1
      - name: Publish target export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_stage6b/completed_outcome_targets_*.csv rookie_models/stage6_export_targets.log
          if git diff --cached --quiet; then
            echo "No target export changes"
          else
            git commit -m "Publish Stage 6 completed outcome targets"
            git push
          fi

# position-split trigger
