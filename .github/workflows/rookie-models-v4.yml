name: Build rookie prospect models v4
on:
  push:
    paths:
      - 'rookie_models/stage4.py'
      - 'rookie_models/stage3.py'
      - 'rookie_models/stage2.py'
      - 'rookie_models/modeling.py'
      - 'rookie_models/requirements_v3.txt'
      - '.github/workflows/rookie-models-v4.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rookie-prospect-models-v4
  cancel-in-progress: false
jobs:
  model-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt
      - run: pip install -r rookie_models/requirements_v3.txt
      - name: Syntax check
        run: python -m py_compile rookie_models/stage4.py
      - name: Run frozen stage 4 architecture test
        run: python rookie_models/stage4.py
      - name: Commit stage 4 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_v4
          git diff --cached --quiet || git commit -m "Update stage 4 rookie model results"
          git push
