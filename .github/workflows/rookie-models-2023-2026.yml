name: Rookie Models 2023-2026 Comparison

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rookie_models/multiyear_2023_2026.py'
      - '.github/workflows/rookie-models-2023-2026.yml'

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt

      - name: Install dependencies
        run: pip install -r rookie_models/requirements_v3.txt

      - name: Build 2023-2026 comparison
        id: build
        continue-on-error: true
        run: |
          mkdir -p rookie_models/results_2023_2026
          python rookie_models/multiyear_2023_2026.py > rookie_models/results_2023_2026/run.log 2>&1

      - name: Commit comparison outputs and log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_2023_2026
          if git diff --cached --quiet; then
            echo "No multiyear output changes"
          else
            git commit -m "Publish 2023-2026 rookie comparison"
            git push
          fi

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          cat rookie_models/results_2023_2026/run.log
          exit 1
