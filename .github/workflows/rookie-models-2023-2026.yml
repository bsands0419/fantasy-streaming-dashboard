name: Rookie Models 2023-2026 Comparison

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rookie_models/multiyear_2023_2026.py'
      - '.github/workflows/rookie-models-2023-2026.yml'

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt

      - name: Install dependencies
        run: pip install -r rookie_models/requirements_v3.txt

      - name: Build 2023-2026 comparison
        run: python rookie_models/multiyear_2023_2026.py

      - name: Commit comparison outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_2023_2026
          if git diff --cached --quiet; then
            echo "No multiyear output changes"
          else
            git commit -m "Publish 2023-2026 rookie comparison"
            git push
          fi
