name: Rookie Models Stage 6 TeamRankings SOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rookie_models/stage6_sos_ablation.py'
      - '.github/workflows/rookie-models-stage6-sos.yml'

permissions:
  contents: write

jobs:
  sos-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt

      - name: Install dependencies
        run: pip install -r rookie_models/requirements_v3.txt

      - name: Run TeamRankings SOS ablation
        id: sos
        continue-on-error: true
        run: |
          set +e
          python rookie_models/stage6_sos_ablation.py > rookie_models/stage6_sos_run.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Commit SOS outputs and run log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_stage6_sos rookie_models/stage6_sos_run.log || true
          if git diff --cached --quiet; then
            echo "No Stage 6 SOS output changes"
          else
            git commit -m "Publish TeamRankings SOS ablation"
            git push
          fi

      - name: Fail workflow if SOS experiment failed
        if: steps.sos.outcome == 'failure'
        run: |
          cat rookie_models/stage6_sos_run.log
          exit 1

# post-registration trigger
