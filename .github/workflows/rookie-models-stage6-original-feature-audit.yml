name: Rookie Models Stage 6 Original Feature Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rookie_models/stage6_original_feature_audit.py'
      - '.github/workflows/rookie-models-stage6-original-feature-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt
      - run: pip install -r rookie_models/requirements_v3.txt
      - run: python rookie_models/stage6_original_feature_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_stage6_newmodels/original_feature_family_audit.csv rookie_models/results_stage6_newmodels/original_feature_family_keys.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish original Stage 6 feature audit"
          git push
# trigger
