name: Rookie Models Full History Export

# Registered on main; this edit triggers the export.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rookie_models/full_history_results.py'
      - '.github/workflows/rookie-models-full-history.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: rookie_models/requirements_v3.txt

      - name: Install dependencies
        run: pip install -r rookie_models/requirements_v3.txt

      - name: Build full 2007-2026 model history export
        run: python rookie_models/full_history_results.py

      - name: Commit full-history outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rookie_models/results_full_history
          if git diff --cached --quiet; then
            echo "No full-history output changes"
          else
            git commit -m "Publish full rookie model history"
            git push
          fi
